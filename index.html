<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centurion Bank - Online Banking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
        }
        .header {
            background-color: #003366;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #003366;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
        }
        .btn:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Centurion Bank</h1>
        <p>Your trusted banking partner</p>
    </div>
    
    <div class="container">
        <h2>Welcome to Online Banking</h2>
        <p>Please select an option to continue:</p>
        
        <a href="login.html" class="btn">Login to Your Account</a>
        <a href="signup.html" class="btn">Sign Up for New Account</a>
    </div>
</body>
</html>
